<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Takuto - Creative Portfolio</title>
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&family=Inter:wght@400;500;700;900&family=Syne:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700" onload="this.rel='stylesheet'" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0B101B] antialiased" style='font-family: "Inter", sans-serif;'>
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-[#0B101B]/80 backdrop-blur-md border-b border-[#242f47]/30 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 text-white">
                    <img src="images/takuto-logo.png" alt="Takuto Logo" class="w-14 h-14">
                    <h2 class="text-xl font-bold leading-tight tracking-tighter">takuto</h2>
                </div>
                <div class="hidden md:flex items-center gap-8">
                    <a href="work.html" class="nav-link text-sm font-medium text-white/80 hover:text-[#00A9E2] transition-all duration-300">Work</a>
                    <a href="about.html" class="nav-link text-sm font-medium text-white/80 hover:text-[#00A9E2] transition-all duration-300">About</a>
                    <a href="contact.html" class="nav-link text-sm font-medium text-white/80 hover:text-[#00A9E2] transition-all duration-300">Contact</a>
                </div>
                <div class="flex items-center gap-4">
                    <a class="cta-button bg-[#007CF0] text-white px-6 py-2 rounded-full font-bold hover:shadow-lg hover:shadow-[#007CF0]/40 transition-all duration-300" href="contact.html">
                        Get in Touch
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="hero" class="hero-section relative min-h-screen w-full overflow-hidden bg-gradient-to-br from-[#0B101B] to-[#111622] parallax-container">
        <div class="floating-elements absolute inset-0 z-0 opacity-20">
            <div class="floating-bubble absolute top-[10%] left-[15%] h-48 w-48 rounded-full bg-gradient-to-br from-[#00A9E2] to-[#00A9E2]/0 blur-2xl"></div>
            <div class="floating-bubble absolute top-[60%] left-[5%] h-32 w-32 rounded-full bg-gradient-to-br from-[#007CF0] to-[#007CF0]/0 blur-2xl"></div>
            <div class="floating-bubble absolute top-[25%] right-[10%] h-40 w-40 rounded-full bg-gradient-to-br from-[#00A9E2] to-[#00A9E2]/0 blur-2xl"></div>
            <div class="floating-bubble absolute bottom-[15%] right-[20%] h-24 w-24 rounded-full bg-gradient-to-br from-[#007CF0] to-[#007CF0]/0 blur-2xl"></div>
            <div class="floating-bubble absolute bottom-[5%] left-[40%] h-28 w-28 rounded-full bg-gradient-to-br from-[#00A9E2] to-[#00A9E2]/0 blur-xl"></div>
            <div class="floating-bubble absolute top-[50%] left-[50%] h-36 w-36 rounded-full bg-gradient-to-br from-[#007CF0] to-[#007CF0]/0 blur-2xl"></div>
        </div>
        <main class="relative z-10 flex h-screen flex-col items-center justify-center text-center px-4 sm:px-6 lg:px-8">
            <div class="max-w-4xl mx-auto">
                <h1 class="hero-title text-5xl md:text-6xl lg:text-7xl font-black text-white leading-tight tracking-tight">
                    Building products, communities, and brands that connect people.
                </h1>
                <div class="mt-6 h-8 text-xl md:text-2xl text-slate-300 relative">
                    <span class="cycling-text">Product Manager • Problem Solver • Founder</span>
                </div>
                <div class="mt-12 flex flex-col sm:flex-row items-center justify-center gap-4">
                    <a class="primary-cta group relative inline-flex items-center justify-center overflow-hidden rounded-full bg-[#007CF0] px-8 py-3 text-base font-bold text-white transition-all duration-300 ease-in-out hover:shadow-lg hover:shadow-[#007CF0]/40" href="work.html">
                        <span class="relative z-10">Explore Projects</span>
                    </a>
                    <a class="secondary-cta group relative inline-flex items-center justify-center rounded-full border-2 border-[#00A9E2] px-8 py-3 text-base font-bold text-[#00A9E2] transition-all duration-300 ease-in-out hover:bg-[#00A9E2] hover:text-[#0B101B]" href="about.html">
                        <span class="relative">About Me</span>
                    </a>
                </div>
            </div>
        </main>
    </section>


    <script src="script.js?v=6"></script>
</body>
</html>
